[package]
name = "scylla-game-db"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8.4", features = ["macros"] }
tokio = { version = "1.47.1", features = ["full"] }
tower = { version = "0.5.2", features = ["util","buffer", "limit"] }
tower-http = { version = "0.6.6", features = ["cors", "trace","util","compression-full","limit"] }

scylla = "1.3.1"
# Database


# Redis
redis = { version = "0.32.4", features = ["tokio-comp", "connection-manager","script"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.142"

# Crypto
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "2.0.12"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Environment
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }

jemalloc-sys = { version = "0.3.2", optional = true }

# URL parsing
url = "2.4"
uuid = { version = "1.8", features = ["serde"]}


# CSV for COPY operations
csv = "1.3"
deadpool-redis = "0.22.0"
deadpool = "0.12.2"
futures = "0.3.31"
fastrand = "2.3.0"
num_cpus = "1.17.0"
socket2 = "0.6.0"
console-subscriber = "0.4.1"

rand = "0.9.2"
urlencoding = "2.1.3"
jsonwebtoken = "9.3.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
